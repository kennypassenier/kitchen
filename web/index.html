<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kitchen</title>
    <link rel="icon" href="/img/icon.svg" type="image/svg+xml" />
    <!-- kp-themes split delivery (chassis-rs 4.2.0): the base stylesheet (fonts included), then the kit's
         no-flash snippet BELOW it, which writes the worn theme's register before the first paint (a parser-
         inserted link, so it lands in the cascade layer the base states first). The attributes are what the
         kit's own layout writes: the register pattern, kp-themes 12.2.0's twelve themes, and the fallback.
         A theme picked later loads its register through attachLazyRegisters (/eten/registers.js). -->
    <link rel="stylesheet" href="/static/kp/dist/kp-themes-base.min.css" />
    <script src="/static/theme-boot.js" data-register-pattern="/static/kp/dist/css/{theme}-register.min.css"
      data-themes="blueprint,brutalism,cyberpunk,dark,deco,forest,formal,nostromo,pastel,solstice,synthwave,titanium"
      data-fallback="formal"></script>
    <!-- kp-themes' page-wide behaviours (dialogs, effects, theme pickers present at load). -->
    <script type="module" src="/static/kp/dist/js/auto.js"></script>
    <link rel="stylesheet" href="/css/app.css" />
    <!-- Every screen's sheet loads with the app, so a screen draws its
         loading state in its final geometry from the first frame. Each
         sheet's rules sit behind the screen's own class prefix. -->
    <!-- wheel.css and recipes.css each in parts: the order here is the cascade order they had as one file. -->
    <link rel="stylesheet" href="/css/pages/wheel/base.css" />
    <link rel="stylesheet" href="/css/pages/wheel/filters.css" />
    <link rel="stylesheet" href="/css/pages/wheel/extras.css" />
    <link rel="stylesheet" href="/css/pages/cook.css" />
    <link rel="stylesheet" href="/css/pages/cook-stage.css" />
    <link rel="stylesheet" href="/css/pages/timing.css" />
    <link rel="stylesheet" href="/css/pages/baddays.css" />
    <!-- recipe.css, in six parts: the order here is the cascade order it had as one file. -->
    <link rel="stylesheet" href="/css/pages/recipe/base.css" />
    <link rel="stylesheet" href="/css/pages/recipe/card.css" />
    <link rel="stylesheet" href="/css/pages/recipe/qr.css" />
    <link rel="stylesheet" href="/css/pages/recipe/print.css" />
    <link rel="stylesheet" href="/css/pages/recipe/log.css" />
    <link rel="stylesheet" href="/css/pages/recipe/photos.css" />
    <link rel="stylesheet" href="/css/pages/recipes/form.css" />
    <link rel="stylesheet" href="/css/pages/recipes/steps.css" />
    <link rel="stylesheet" href="/css/pages/recipes/import.css" />
    <link rel="stylesheet" href="/css/pages/recipes/editpage.css" />
    <link rel="stylesheet" href="/css/pages/settings.css" />
    <link rel="stylesheet" href="/eten/dishwheel.css" />
    <link rel="stylesheet" href="/eten/wheel.css" />
    <link rel="stylesheet" href="/css/pages/dishes.css" />
    <script type="module" src="/js/main.js"></script>
  </head>
  <body>
    <a class="kp-skip-link" href="#page">Skip to content</a>
    <div class="kp-nav-wrap">
      <nav class="kp-nav" data-kp-nav-fold aria-label="Pages" id="bar">
        <a class="kp-nav__brand" id="brand" href="/">Kitchen</a>
        <button type="button" class="kp-nav__toggle" data-kp-nav-toggle></button>
        <ul class="kp-nav__links" id="nav"></ul>
        <span class="app-tools" id="tools"></span>
      </nav>
    </div>
    <main class="app-shell kp-page" id="page" tabindex="-1"></main>
    <!-- The kit's connection band (kp-themes connection.js, as chassis-rs' own layout draws it): no room while online;
         offline, reconnecting and the count of edits waiting to be sent (feat-offline-kitchen). The kit's data client
         paints the queue, web/js/offline/band.js the reads; retries are the kit's own timer, so no band timer. -->
    <div class="kp-connection" data-kp-connection data-kp-connection-source="both" data-kp-retry-delays="off"></div>
  </body>
</html>
