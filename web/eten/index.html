<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- A web app on the home screen (Kenny, 24/10/2026 11:00): pinned on iOS it opens full screen, without Safari's
         bar. The kit gives the home page its own manifest (web/pwa icons); this one is the parents' page. -->
    <link rel="manifest" href="/eten/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/eten/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Eten" />
    <meta name="theme-color" content="#2f5d50" />
    <title>Wat eten we vanavond?</title>
    <link rel="icon" href="/eten/icon.svg" type="image/svg+xml" />
    <!-- kp-themes split delivery (chassis-rs 4.2.0): the base stylesheet (fonts included), then the kit's
         no-flash snippet BELOW it, which writes the worn theme's register before the first paint (a parser-
         inserted link, so it lands in the cascade layer the base states first). The attributes are what the
         kit's own layout writes: the register pattern, kp-themes 12.2.0's twelve themes, and the fallback.
         A theme picked later loads its register through attachLazyRegisters (/eten/registers.js). -->
    <link rel="stylesheet" href="/static/kp/dist/kp-themes-base.min.css" />
    <script src="/static/theme-boot.js" data-register-pattern="/static/kp/dist/css/{theme}-register.min.css"
      data-themes="blueprint,brutalism,cyberpunk,dark,deco,forest,formal,nostromo,pastel,solstice,synthwave,titanium"
      data-fallback="formal"></script>
    <!-- kp-themes' page-wide behaviours (dialogs, effects, theme pickers present at load). -->
    <script type="module" src="/static/kp/dist/js/auto.js"></script>
    <link rel="stylesheet" href="/eten/dishwheel.css" />
    <link rel="stylesheet" href="/eten/wheel.css" />
    <link rel="stylesheet" href="/eten/eten.css" />
    <script type="module" src="/eten/eten.js"></script>
  </head>
  <body>
    <a class="kp-skip-link" href="#page">Naar het wiel</a>
    <!-- The theme picker, top right (Kenny, 24/10/2026 09:29): the kit's own menu, filled in by theme.js. -->
    <header class="eten-bar"><span class="eten-theme" id="eten-theme"></span></header>
    <main class="eten-shell" id="page" tabindex="-1"></main>
  </body>
</html>
