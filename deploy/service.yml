# The homelab's stack file for a native service (AR18; `homelab adopt`).
# vmid and hostname are filled in at adoption: the hostname MUST be
# <vmid>-app-<stack>, the homelab validates it. update_cmd reproduces the
# environment the unit gives the service — same user and group, the same
# EnvironmentFile, the same working directory, and one --property=Environment=
# per Environment= line the unit declares — and waits for the result
# (critic #7), so "already current" is exit 0 without a restart and a failure
# carries its stderr.
#
# The Environment= lines are not decoration (fix-3, Almanac on CT 112,
# 2026-09-09): without them a supervised `update --check` looks for state at
# the binary's compiled-in default instead of this machine's directory, and
# fails with a message that blames a missing secret. Add a line here for
# every Environment= line added to the unit.
stack_name: recepten
vmid: 0
hostname: 0-app-recepten
unit: recepten
binary: /opt/recepten/bin/recepten
env_file: /etc/recepten/recepten.env
data_dirs:
  - /var/lib/recepten
update_cmd: >-
  systemd-run --wait --pipe --collect --uid=recepten --gid=recepten
  --property=EnvironmentFile=/etc/recepten/recepten.env
  --property=WorkingDirectory=/var/lib/recepten
  --property=Environment=RECEPTEN_STATE_DIR=/var/lib/recepten
  --property=Environment=RECEPTEN_TIMEOUT_STOP_SECS=60
  /opt/recepten/bin/recepten update
release_repo: kennypassenier/recepten
release_asset: recepten
