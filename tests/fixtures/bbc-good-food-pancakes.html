<!doctype html>
<html><head><meta charset="utf-8"><title>Easy pancakes</title>
<script type="application/ld+json">
{
 "@context": "https://schema.org",
 "@type": "Recipe",
 "name": "Easy pancakes",
 "recipeYield": "Makes 12",
 "prepTime": "PT10M",
 "cookTime": "PT20M",
 "totalTime": "PT30M",
 "recipeIngredient": [
  "100g plain flour",
  "2 large eggs",
  "300ml milk",
  "1 tbsp sunflower or vegetable oil plus a little extra for frying",
  "lemon wedges to serve (optional)",
  "caster sugar to serve (optional)"
 ],
 "recipeInstructions": [
  {
   "@type": "HowToStep",
   "text": "Put 100g plain flour, 2 large eggs, 300ml milk, 1 tbsp sunflower or vegetable oil and a pinch of salt into a bowl or large jug, then whisk to a smooth batter. This should be similar in consistency to single cream."
  },
  {
   "@type": "HowToStep",
   "text": "Set aside for 30 mins to rest if you have time, or start cooking straight away."
  },
  {
   "@type": "HowToStep",
   "text": "Set a medium frying pan or crêpe pan over a medium heat and carefully wipe it with some oiled kitchen paper."
  },
  {
   "@type": "HowToStep",
   "text": "When hot, cook your pancakes for 1 min on each side until golden, using around half a ladleful of batter per pancake. Keep them warm in a low oven as you make the rest."
  },
  {
   "@type": "HowToStep",
   "text": "Serve with lemon wedges and caster sugar, or your favourite filling. Once cold, you can layer the pancakes between baking parchment, then wrap in cling film and freeze for up to two months."
  }
 ],
 "image": [
  {

  }
 ]
}
