 "name": "How to Make the Best Guacamole",
 "recipeYield": "4",
 "prepTime": "PT10M",
 "totalTime": "PT10M",
 "recipeIngredient": [
  "2 ripe avocados",
  "1/4 teaspoon salt, plus more to taste",
  "1 tablespoon fresh lime or lemon juice",
  "2-4 tablespoons minced red onion or thinly sliced green onion",
  "1-2 serrano (or jalapeño) chiles, stems and seeds removed, minced",
  "2 tablespoons cilantro (leaves and tender stems), finely chopped",
  "Pinch freshly ground black pepper",
  "1/2 ripe tomato, chopped (optional)",
  "Red radish or jicama slices for garnish (optional)",
  "Tortilla chips , to serve"
 ],
 "recipeInstructions": [
  {
   "@type": "HowToStep",
   "name": "Cut the avocados:",
   "image": [
    {
     "@type": "ImageObject",
     "contentUrl": "https://www.simplyrecipes.com/thmb/pYEdtm0o-jR0PMsPV7v-B-C4cRg=/1500x0/filters:no_upscale():max_bytes(150000):strip_icc()/__opt__aboutcom__coeus__resources__content_migration__simply_recipes__uploads__2014__05__guacamole-method-1-800-989ca421ef1148a9b33d15eeefc06926.jpg",
     "creditText": "Elise Bauer"
    }
   ],
   "text": "Cut the avocados in half. Remove the pit. Score the inside of the avocado with a blunt knife and scoop out the flesh with a spoon. (See How to Cut and Peel an Avocado .) Place in a bowl."
  },
  {
   "@type": "HowToStep",
   "name": "Mash the avocado flesh:",
   "image": [
    {
     "@type": "ImageObject",
     "contentUrl": "https://www.simplyrecipes.com/thmb/ymp-gcWLfa7xQtPQEdQuhBseiLo=/1500x0/filters:no_upscale():max_bytes(150000):strip_icc()/__opt__aboutcom__coeus__resources__content_migration__simply_recipes__uploads__2014__05__guacamole-method-2-800-fabac47f7d9a412fb8c7253926da52c4.jpg",
     "creditText": "Elise Bauer"
    }
   ],
   "text": "Using a fork, roughly mash the avocado. Don’t overdo it! The guacamole should be a little chunky."
  },
  {
   "@type": "HowToStep",
   "name": "Add the remaining ingredients to taste:",
   "text": "Sprinkle with salt and lime (or lemon) juice. The acid in the lime juice will provide some balance to the richness of the avocado and will help delay the avocados from turning brown. Add the chopped onion, cilantro, black pepper, and chilis. Chili peppers vary individually in their spiciness. So, start with a half of one chili pepper and add more to the guacamole to your desired degree of heat. Remember that much of this is done to taste because of the variability in the fresh ingredients. Start with this recipe and adjust to your taste."
  },
  {
   "@type": "HowToStep",
   "name": "Serve immediately:",
   "text": "If making a few hours ahead, place plastic wrap on the surface of the guacamole and press down to cover it to prevent air reaching it. (The oxygen in the air causes oxidation which will turn the guacamole brown.) Garnish with slices of red radish or jicama strips. Serve with your choice of store-bought tortilla chips or make your own homemade tortilla chips . Refrigerate leftover guacamole up to 3 days. Note: Chilling tomatoes dulls their flavor. So, if you want to add chopped tomato to your guacamole, add just before serving."
  },
  {
   "@type": "HowToStep",
   "image": [
    {
     "@type": "ImageObject",
     "contentUrl": "https://www.simplyrecipes.com/thmb/J4kA2m6jKMgkQwZhG-RYpjZBeFQ=/1500x0/filters:no_upscale():max_bytes(150000):strip_icc()/Guacamole-LEAD-6-2-64cfcca253c8421dad4e3fad830219f6.jpg",
     "creditText": "Simply Recipes / Elise Bauer"
    }
   ],
   "text": "Enjoy!"
  }
